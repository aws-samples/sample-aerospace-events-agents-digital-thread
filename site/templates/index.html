<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SITE_TITLE --></title>
<meta name="description" content="<!-- SITE_TAGLINE_ATTR -->">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Aerospace Events · Digital Thread — demo gallery
   Engineering-dossier aesthetic: mono telemetry labels,
   editorial Playfair headers, a single blue "thread" accent.
   Shared design system (identical CSS in index.html + demo.html).
   ============================================================ */
:root{
  --ink:#0a0a0c; --ink-2:#0c0c10; --ink-3:#101016;
  --surface:#141418; --surface-2:#17171d; --surface-hover:#1d1d25;
  --line:#262630; --line-soft:#1b1b22; --line-bright:#34343f;
  --text:#e9e7f0; --text-2:#9b99aa; --text-3:#646276; --text-4:#454354;
  --blue:#4a9eff; --blue-bright:#6cb2ff; --blue-soft:rgba(74,158,255,.12);
  --blue-line:rgba(74,158,255,.30); --blue-glow:rgba(74,158,255,.22);
  --amber:#ff9a62; --green:#3ddc97; --violet:#b29cff;
  --display:'Playfair Display',Georgia,serif;
  --body:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 20px 50px -24px rgba(0,0,0,.85);
  --shadow-lift:0 1px 0 rgba(255,255,255,.04) inset,0 32px 70px -28px rgba(0,0,0,.9);
  --maxw:1120px; --read:824px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--body); background:var(--ink); color:var(--text);
  line-height:1.65; font-weight:400; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility; letter-spacing:.005em;
  min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(900px 520px at 78% -8%, rgba(74,158,255,.10), transparent 60%),
    radial-gradient(760px 480px at 8% 4%, rgba(178,156,255,.05), transparent 55%),
    linear-gradient(180deg,#0b0b10 0%,#0a0a0c 38%,#0a0a0c 100%);
}
/* faint engineering grid */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 78%);
          mask-image:radial-gradient(circle at 50% 0,#000,transparent 78%);
}
.wrap{position:relative; z-index:1; max-width:var(--maxw); margin:0 auto; padding:0 28px}
a{color:inherit; text-decoration:none}
::selection{background:var(--blue-glow); color:#fff}

/* ---- mono eyebrow / telemetry label ---- */
.eyebrow{
  font-family:var(--mono); font-size:11.5px; font-weight:500;
  letter-spacing:.24em; text-transform:uppercase; color:var(--blue);
  display:inline-flex; align-items:center; gap:.7em;
}
.eyebrow::before{
  content:""; width:26px; height:1px; background:linear-gradient(90deg,var(--blue),transparent);
}

/* ============================== top bar ============================== */
.topbar{
  position:sticky; top:0; z-index:30; backdrop-filter:blur(14px);
  background:rgba(10,10,12,.72); border-bottom:1px solid var(--line-soft);
}
.topbar .wrap{display:flex; align-items:center; justify-content:space-between; height:62px}
.brand{display:flex; align-items:center; gap:11px; font-weight:500; letter-spacing:.01em}
.brand .mark{
  width:24px; height:24px; position:relative; flex:0 0 auto;
}
.brand .mark::before,.brand .mark::after{
  content:""; position:absolute; border-radius:50%;
}
.brand .mark::before{ inset:0; border:1.5px solid var(--blue); opacity:.55 }
.brand .mark::after{ inset:7px; background:var(--blue); box-shadow:0 0 12px var(--blue-glow) }
.brand b{font-weight:600}
.brand .sub{color:var(--text-3); font-weight:400}
.topbar .meta{font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--text-3); text-transform:uppercase}

/* ============================== hero ============================== */
.hero{position:relative; padding:86px 0 30px}
.hero .eyebrow{margin-bottom:26px}
.hero h1{
  font-family:var(--display); font-weight:800; line-height:1.02;
  font-size:clamp(40px,6.4vw,82px); letter-spacing:-.018em; max-width:16ch;
  background:linear-gradient(176deg,#fbfaff 8%,#cfcde0 68%,#8f8da4 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero h1 em{font-style:italic; font-weight:600; color:var(--blue);
  -webkit-text-fill-color:var(--blue); background:none}
.hero .lede{
  margin-top:24px; max-width:60ch; font-size:18.5px; color:var(--text-2); font-weight:300; line-height:1.6;
}
.hero .lede strong{color:var(--text); font-weight:500}
.hero .stats{
  display:flex; flex-wrap:wrap; gap:34px; margin-top:38px;
  font-family:var(--mono); font-size:12px; color:var(--text-3); letter-spacing:.04em;
}
.hero .stats span{display:flex; flex-direction:column; gap:3px}
.hero .stats b{font-size:21px; font-weight:600; color:var(--text); letter-spacing:-.01em}
.hero .stats i{font-style:normal; text-transform:uppercase; letter-spacing:.16em; font-size:10px}

/* thread divider */
.thread{height:1px; margin:54px 0 12px; position:relative;
  background:linear-gradient(90deg,transparent,var(--line),transparent)}
.thread::after{content:""; position:absolute; left:0; top:-2px; width:5px; height:5px; border-radius:50%;
  background:var(--blue); box-shadow:0 0 10px var(--blue-glow); animation:run 9s linear infinite}
@keyframes run{from{left:0}to{left:100%}}

/* ============================== feature (hero demo) ============================== */
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin:30px 0 22px}
.section-head h2{font-family:var(--display); font-weight:700; font-size:23px; letter-spacing:-.01em}
.section-head .count{font-family:var(--mono); font-size:11px; color:var(--text-3); letter-spacing:.18em; text-transform:uppercase}

.feature{
  position:relative; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:30px;
  padding:30px 34px; border-radius:var(--radius); background:
    linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--line); box-shadow:var(--shadow); overflow:hidden;
  transition:border-color .35s,transform .35s,box-shadow .35s;
}
.feature::before{content:""; position:absolute; inset:0;
  background:radial-gradient(560px 200px at 88% 0,var(--blue-soft),transparent 70%); pointer-events:none}
.feature:hover{border-color:var(--blue-line); transform:translateY(-2px); box-shadow:var(--shadow-lift)}
.feature .badge{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--blue); border:1px solid var(--blue-line); border-radius:100px; padding:7px 14px;
  background:var(--blue-soft); white-space:nowrap;
}
.feature .ft-body{min-width:0}
.feature h3{font-family:var(--display); font-size:27px; font-weight:700; letter-spacing:-.012em; line-height:1.12}
.feature p{margin-top:9px; color:var(--text-2); font-weight:300; font-size:15.5px; max-width:74ch}
.feature .go{
  font-family:var(--mono); font-size:12.5px; letter-spacing:.04em; color:var(--text); white-space:nowrap;
  display:inline-flex; align-items:center; gap:9px; padding:11px 18px; border-radius:100px;
  border:1px solid var(--line-bright); background:var(--ink-3); transition:gap .3s,border-color .3s,background .3s;
}
.feature:hover .go{gap:14px; border-color:var(--blue-line); background:var(--blue-soft)}
.feature .go svg{width:14px; height:14px}

/* ============================== grid of demos ============================== */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
.card{
  position:relative; display:flex; flex-direction:column; min-height:184px;
  padding:26px 26px 22px; border-radius:var(--radius); background:var(--surface);
  border:1px solid var(--line-soft); box-shadow:var(--shadow); overflow:hidden;
  transition:border-color .3s,transform .3s,box-shadow .3s,background .3s;
}
.card::after{content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
  background:linear-gradient(180deg,var(--blue),transparent 70%); opacity:0; transition:opacity .3s}
.card:hover{transform:translateY(-3px); border-color:var(--line-bright);
  background:var(--surface-2); box-shadow:var(--shadow-lift)}
.card:hover::after{opacity:1}
.card .num{
  font-family:var(--mono); font-size:12px; font-weight:500; color:var(--text-3);
  letter-spacing:.12em; display:flex; align-items:center; gap:10px; margin-bottom:16px;
}
.card .num b{
  font-size:13px; color:var(--blue); border:1px solid var(--blue-line); background:var(--blue-soft);
  width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:600;
}
.card h3{font-family:var(--display); font-size:21px; font-weight:700; letter-spacing:-.01em; line-height:1.16}
.card .proves{margin-top:10px; color:var(--text-2); font-size:14px; font-weight:300; line-height:1.55; flex:1}
.card .proves b{color:var(--text); font-weight:500}
.card .foot{
  margin-top:18px; display:flex; align-items:center; justify-content:space-between;
  font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--text-3); text-transform:uppercase;
}
.card .foot .arrow{color:var(--text-2); transition:transform .3s,color .3s}
.card:hover .foot .arrow{transform:translateX(4px); color:var(--blue)}
.card .trigger{color:var(--text-4)}
.card .trigger code{font-size:11px; color:var(--text-3)}

/* ============================== article (demo page) ============================== */
.crumbs{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3); display:flex; align-items:center; gap:10px}
.crumbs a:hover{color:var(--blue)}
.crumbs .back{display:inline-flex; align-items:center; gap:8px; color:var(--text-2)}
.crumbs .back:hover{color:var(--blue)}
.crumbs .sep{color:var(--text-4)}

.demo-hero{padding:54px 0 8px}
.demo-hero .eyebrow{margin-bottom:20px}
.demo-hero h1{font-family:var(--display); font-weight:800; font-size:clamp(32px,4.6vw,52px);
  letter-spacing:-.018em; line-height:1.06; max-width:20ch;
  background:linear-gradient(176deg,#fbfaff,#c9c7da 78%); -webkit-background-clip:text; background-clip:text; color:transparent}
.demo-hero .tagline{margin-top:18px; max-width:66ch; font-size:18px; color:var(--text-2); font-weight:300; line-height:1.62}
.demo-hero .tagline strong{color:var(--text); font-weight:500}

.videoframe{
  margin:34px 0 8px; border-radius:var(--radius); overflow:hidden; position:relative;
  border:1px solid var(--line); background:#000; box-shadow:var(--shadow-lift);
}
.videoframe::before{content:""; position:absolute; inset:0; border-radius:var(--radius);
  box-shadow:0 0 0 1px rgba(74,158,255,.08) inset; pointer-events:none; z-index:2}
.videoframe video{display:block; width:100%; height:auto; background:#000}
.videocap{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--text-3);
  text-transform:uppercase; margin:12px 2px 0; display:flex; align-items:center; gap:9px}
.videocap::before{content:"▸"; color:var(--blue)}

/* article body (injected markdown) */
.article{max-width:var(--read); margin:44px auto 0; padding-bottom:8px}
.article h2{font-family:var(--display); font-weight:700; font-size:27px; letter-spacing:-.012em;
  margin:50px 0 16px; line-height:1.18; scroll-margin-top:84px; position:relative; padding-left:0}
.article h2::before{content:""; display:block; width:40px; height:2px; margin-bottom:18px;
  background:linear-gradient(90deg,var(--blue),transparent)}
.article h3{font-family:var(--display); font-weight:700; font-size:20px; margin:34px 0 12px; color:var(--text)}
.article p{color:var(--text-2); font-size:16.5px; font-weight:300; line-height:1.74; margin:14px 0}
.article p strong,.article li strong{color:var(--text); font-weight:600}
.article a{color:var(--blue); text-decoration:none; border-bottom:1px solid var(--blue-line);
  transition:border-color .2s,color .2s}
.article a:hover{color:var(--blue-bright); border-color:var(--blue)}
.article ul,.article ol{margin:14px 0; padding-left:1.3em; color:var(--text-2); font-weight:300}
.article li{margin:7px 0; font-size:16px; line-height:1.7}
.article li::marker{color:var(--blue)}
.article code{font-family:var(--mono); font-size:.86em; background:var(--ink-3); color:var(--blue-bright);
  border:1px solid var(--line-soft); border-radius:6px; padding:.12em .42em}
.article pre{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:18px 20px; overflow-x:auto; margin:20px 0; box-shadow:var(--shadow)}
.article pre code{background:none; border:none; padding:0; color:var(--text-2); font-size:13px; line-height:1.7}
.article blockquote{margin:22px 0; padding:14px 22px; border-left:2px solid var(--blue-line);
  background:linear-gradient(90deg,var(--blue-soft),transparent); border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  color:var(--text-2); font-size:15.5px}
.article blockquote p{margin:6px 0; color:var(--text-2)}
.article hr{border:none; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); margin:42px 0}
.article figure{margin:30px 0}
.article figure img{width:100%; height:auto; display:block; border-radius:var(--radius-sm);
  border:1px solid var(--line); box-shadow:var(--shadow-lift)}
.article figure figcaption{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--text-3);
  text-transform:uppercase; margin-top:11px; text-align:center}
.article img{max-width:100%; border-radius:var(--radius-sm)}

/* live-evidence + general tables */
.article table{width:100%; border-collapse:separate; border-spacing:0; margin:24px 0; font-size:14.5px;
  border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; box-shadow:var(--shadow)}
.article thead th{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--text-3); text-align:left; padding:13px 18px; background:var(--ink-3);
  border-bottom:1px solid var(--line)}
.article tbody td{padding:12px 18px; border-bottom:1px solid var(--line-soft); color:var(--text-2); font-weight:300; vertical-align:top}
.article tbody tr:last-child td{border-bottom:none}
.article tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.article tbody td strong{color:var(--text); font-weight:600; font-family:var(--mono); font-size:13.5px}
.article td a{font-weight:400}

/* prev / next */
.pager{display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:var(--read); margin:54px auto 0}
.pager a{display:flex; flex-direction:column; gap:6px; padding:20px 22px; border-radius:var(--radius);
  border:1px solid var(--line-soft); background:var(--surface); transition:border-color .3s,background .3s,transform .3s}
.pager a:hover{border-color:var(--blue-line); background:var(--surface-2); transform:translateY(-2px)}
.pager .dir{font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-3)}
.pager .ttl{font-family:var(--display); font-size:17px; font-weight:600; color:var(--text)}
.pager .next{text-align:right; align-items:flex-end}
.pager .empty{visibility:hidden}

/* ============================== footer ============================== */
.foot-site{margin-top:72px; border-top:1px solid var(--line-soft); padding:34px 0 60px}
.foot-site .wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:18px}
.foot-site .note{color:var(--text-3); font-size:13.5px; font-weight:300; max-width:60ch}
.foot-site .tags{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-4);
  display:flex; gap:18px; flex-wrap:wrap}
.foot-site .tags span{display:inline-flex; align-items:center; gap:7px}
.foot-site .tags span::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--blue); opacity:.6}

/* ============================== motion ============================== */
@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0; transform:translateY(14px); animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1; transform:none}}
  .d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.21s}
  .d4{animation-delay:.29s}.d5{animation-delay:.37s}
}

/* ============================== responsive ============================== */
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .feature{grid-template-columns:1fr; gap:18px; align-items:flex-start}
  .feature .go{align-self:flex-start}
  .pager{grid-template-columns:1fr}
  .pager .next{text-align:left; align-items:flex-start}
  .hero{padding:60px 0 20px}
  .topbar .meta{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="mark"></span>
      <span><b>Digital Thread</b> <span class="sub">· demo gallery</span></span>
    </a>
    <span class="meta">AWS · eu-west-1 · AgentCore</span>
  </div>
</header>

<main>
  <section class="hero wrap">
    <span class="eyebrow reveal">Aerospace Events Agents</span>
    <h1 class="reveal d1"><!-- SITE_TITLE_DISPLAY --></h1>
    <p class="lede reveal d2"><!-- SITE_TAGLINE --></p>
    <div class="stats reveal d3">
      <!-- STATS -->
    </div>
    <div class="thread reveal d3"></div>
  </section>

  <section class="wrap">
    <div class="section-head reveal d2">
      <h2>Start here</h2>
      <span class="count">The whole picture</span>
    </div>
    <!-- FEATURE -->

    <div class="section-head reveal" style="margin-top:48px">
      <h2>The seven pillars</h2>
      <span class="count"><!-- CARD_COUNT --></span>
    </div>
    <div class="grid">
      <!-- CARDS -->
    </div>
  </section>
</main>

<footer class="foot-site">
  <div class="wrap">
    <p class="note"><!-- FOOTER_NOTE --></p>
    <div class="tags">
      <span>AWS sample demo gallery</span>
      <span>eu-west-1</span>
      <span>AWS CDK · 15 stacks</span>
    </div>
  </div>
</footer>

</body>
</html>
